name: Update jdkdb - clean
on:
  workflow_dispatch:
    inputs:
      remove-incomplete:
        description: 'Remove incomplete data (checksums, release_info, or all)'
        required: false
        type: choice
        options:
          - ''
          - checksums
          - release_info
          - all
        default: ''
      remove-invalid:
        description: 'Remove invalid data'
        required: true
        type: boolean
        default: true
      remove-orphanded:
        description: 'Remove orphaned data'
        required: true
        type: boolean
        default: true
      prune-ea:
        description: 'Prune EA releases older than this age'
        required: false
        type: string
        default: '100y'
      prune-unlisted:
        description: 'Prune unlisted releases older than this age'
        required: false
        type: string
        default: '1w'
      do_commit:
        description: 'Commit the changes after cleaning data'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      remove-incomplete:
        description: 'Remove incomplete data (checksums, release_info, or all)'
        required: false
        type: string
        default: ''
      remove-invalid:
        description: 'Remove invalid data'
        required: false
        type: boolean
        default: true
      remove-orphanded:
        description: 'Remove orphaned data'
        required: false
        type: boolean
        default: true
      prune-ea:
        description: 'Prune EA releases older than this age'
        required: false
        type: string
        default: '100y'
      prune-unlisted:
        description: 'Prune unlisted releases older than this age'
        required: false
        type: string
        default: '1w'
      do_commit:
        description: 'Commit the changes after cleaning data'
        required: false
        type: boolean
        default: true
      branch:
        description: 'Branch to commit to (leave empty to use current branch)'
        required: false
        type: string
        default: ''
    outputs:
      changes_detected:
        description: 'Whether the commit step detected and committed any changes'
        value: ${{ jobs.process.outputs.changes_detected }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  process:
    runs-on: 'ubuntu-latest'
    outputs:
      changes_detected: ${{ steps.commit.outputs.changes_detected }}
    env:
      APP: https://github.com/jbangdev/jdkdb-scraper/releases/latest/download/jdkdb-scraper-standalone.jar
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        ref: ${{ inputs.branch || github.ref }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils cpio rpm2cpio msitools

    - name: Set up JDK 21
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup JBang
      uses: jbangdev/setup-jbang@312c53a4221283f9c8e4aa84d8261b82f0c680fb # main

    - name: Run cleaner
      continue-on-error: true
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        EXTRA_OPTS=""
        if [ -n "${{ inputs.remove-incomplete }}" ]; then
          EXTRA_OPTS="$EXTRA_OPTS --remove-incomplete ${{ inputs.remove-incomplete }}"
        fi
        if [ "${{ inputs.remove-invalid }}" = "true" ]; then
          EXTRA_OPTS="$EXTRA_OPTS --remove-invalid"
        fi
        if [ "${{ inputs.remove-orphanded }}" = "true" ]; then
          EXTRA_OPTS="$EXTRA_OPTS --remove-orphanded"
        fi
        if [ -n "${{ inputs.prune-ea }}" ]; then
          EXTRA_OPTS="$EXTRA_OPTS --prune-ea ${{ inputs.prune-ea }}"
        fi
        if [ -n "${{ inputs.prune-unlisted }}" ]; then
          EXTRA_OPTS="$EXTRA_OPTS --prune-unlisted ${{ inputs.prune-unlisted }}"
        fi
        echo "Running clean with: $EXTRA_OPTS"
        jbang --java 21+ $APP --version
        jbang --java 21+ $APP clean $EXTRA_OPTS

    - name: Commit & Push changes
      id: commit
      uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
      if: inputs.do_commit
      with:
        commit_message: "Clean up repository data"
        branch: ${{ inputs.branch || github.ref_name }}

    - name: Upload log files
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: always()
      with:
        name: clean-logs
        path: logs/**/*.log
        retention-days: 30
